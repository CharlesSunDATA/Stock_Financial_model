name: Daily Research Delta

on:
  schedule:
    - cron: "15 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache research database
        uses: actions/cache@v4
        with:
          path: |
            data/quant_data.db
            data/quant_data.db-wal
            data/quant_data.db-shm
          key: research-db-${{ github.run_id }}
          restore-keys: |
            research-db-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        run: python scripts/init_db.py

      - name: Seed research watchlist
        run: python -m scripts.seed_research_watchlist

      - name: Update EOD prices
        if: ${{ env.FMP_API_KEY != '' }}
        run: |
          python -m scripts.update_prices_eod \
            --mode per-symbol \
            --universe watchlist \
            --days 7 \
            --calls-per-minute 240 \
            --max-retries 3 \
            --fallback-source alpha-vantage \
            --alpha-calls-per-minute 5

      - name: Update event calendars
        if: ${{ env.FMP_API_KEY != '' }}
        run: python -m scripts.update_calendars_fmp --max-age-hours 0 --datasets earnings_calendar,economic_calendar,mergers_acquisitions

      - name: Update stock news
        if: ${{ env.FMP_API_KEY != '' }}
        run: python -m scripts.update_news_fmp --max-age-hours 0 --pages 1

      - name: Update macro series
        if: ${{ env.FRED_API_KEY != '' }}
        run: python -m scripts.update_fred --lookback 7

      - name: Export delta package
        run: python scripts/export_incremental_research.py --lookback-days 7

      - name: Upload delta artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-delta
          path: research_deltas/
          retention-days: 14

      - name: Upload delta to Google Drive
        if: ${{ env.RCLONE_CONFIG_GDRIVE != '' }}
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q rclone-current-linux-amd64.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/local/bin/
          mkdir -p ~/.config/rclone
          printf "%s" "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          rclone copy research_deltas gdrive:Stock_Financial_model/research_deltas --create-empty-src-dirs
